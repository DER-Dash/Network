<!-- app install -->
<style>
.pwa-btn{display:none}
.pwa-ok .pwa-btn{display:inline-flex}
.pwa-tip{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;width:min(420px,calc(100vw - 32px));background:var(--panel);color:var(--ink);border:2px solid var(--accent);border-radius:10px;padding:14px 16px;box-shadow:0 14px 40px rgba(0,0,0,.35);font-size:14.5px;line-height:1.45}
.pwa-tip[hidden]{display:none}
.pwa-tip b{display:block;margin-bottom:4px;font:700 15px var(--f-body)}
.pwa-tip .row{display:flex;justify-content:flex-end;margin-top:10px}
</style>
<div id="pwaTip" class="pwa-tip" role="dialog" aria-live="polite" hidden><b>Install this game</b><span id="pwaTipTxt"></span><div class="row"><button type="button" class="btn" id="pwaTipOk">OK</button></div></div>
<script>
(function(){
  if(!('serviceWorker' in navigator)||!(/^https:/.test(location.protocol)||location.hostname==='localhost'))return;
  addEventListener('load',function(){navigator.serviceWorker.register('../sw.js',{scope:'../'}).catch(function(){});});
  var standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  if(standalone)return;
  var deferred=null,ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  function addButtons(){
    var f=document.querySelector('.foot');if(f&&!document.getElementById('pwaFoot')){var b=document.createElement('button');b.type='button';b.className='linkish pwa-btn';b.id='pwaFoot';b.textContent='Install as an app';f.insertBefore(b,f.children[1]||null);}
    var g=document.querySelector('#overlay .go > span');if(g&&!g.querySelector('.pwa-btn')){var s=document.createElement('button');s.type='button';s.className='btn pwa-btn';s.textContent='Install app';g.insertBefore(s,g.firstChild);}
  }
  function enable(){document.documentElement.classList.add('pwa-ok');addButtons();setInterval(addButtons,1000);}
  addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e;enable();});
  addEventListener('appinstalled',function(){document.documentElement.classList.remove('pwa-ok');});
  var hasManifest=!!document.querySelector('link[rel=manifest]');
  enable();
  if(/[?&]install=1/.test(location.search))setTimeout(function(){var b=document.querySelector('.pwa-btn');if(b)b.click();},800);
  document.addEventListener('click',function(e){
    if(e.target.id==='pwaTipOk'){document.getElementById('pwaTip').hidden=true;return;}
    var b=e.target.closest&&e.target.closest('.pwa-btn');if(!b)return;e.preventDefault();e.stopPropagation();
    if(!hasManifest){location.href='../generation/?install=1';return;}
    if(deferred){deferred.prompt();deferred.userChoice.then(function(){deferred=null;});return;}
    document.getElementById('pwaTipTxt').textContent=ios?'In Safari, tap the Share button, then "Add to Home Screen". The game then opens full screen from its own icon and works offline.':'Tap the ⋮ menu at the top right of Chrome, then "Add to Home screen" (or "Install app"), then "Install". The game then opens full screen from its own icon and works offline.';
    document.getElementById('pwaTip').hidden=false;
  },true);
})();
</script>
<!-- /app install -->
