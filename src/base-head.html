<title>Losing Control</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500;600&family=Caveat:wght@600&display=swap">
<style>
/* Layout: control-room desk. Mimic diagram + look-ahead chart on the left, contingency panel + event log on the right, flexibility register across the bottom. */
:root{
  --bg:#ecebf3; --panel:#fbfaff; --sunk:#f2f0f9; --ink:#1a1730; --muted:#5f5b78; --rule:#d3d0e3;
  --hv:#8a2f6b; --mv:#1b6a8a; --accent:var(--wu-navy); --on-accent:#ffffff; --pulse:#ffffff;
  /* Watts Up navy: the one colour the header, buttons and accents are built from */
  --wu-navy:#0B1F3A;
  --brand:var(--wu-navy); --brand-2:color-mix(in srgb,var(--wu-navy) 82%,#fff); --brand-line:color-mix(in srgb,var(--wu-navy) 65%,#fff); --brand-ink:#ffffff; --brand-muted:color-mix(in srgb,var(--wu-navy) 22%,#fff); --zap:#ffc928; --zap-ink:var(--wu-navy); --ok-on-brand:#5fe0a0; --alarm-on-brand:#ff9384;
  --c-solar:#d48c00; --c-wind:#0f9384; --c-batt:#6f4ce6; --c-gas:#dc5a24; --c-dsr:#c93d78; --c-cold:#2f7fd6; --c-storm:#6a48d6;
  --ok:#2c8a57; --warn:#b5730a; --alarm:#c4352b;
  --ok-bg:#d8ede0; --warn-bg:#f5e6c6; --alarm-bg:#f6d6d1; --scrim:rgba(20,14,48,.6);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#100e1d; --panel:#18152b; --sunk:#201c38; --ink:#e8e6f5; --muted:#9a95b8; --rule:#322b55;
    --hv:#d281b6; --mv:#5db3d6; --accent:color-mix(in srgb,var(--wu-navy) 30%,#fff); --on-accent:#120f22; --pulse:#0c1416;
    --brand:color-mix(in srgb,var(--wu-navy) 80%,#000); --brand-2:var(--wu-navy); --brand-line:color-mix(in srgb,var(--wu-navy) 70%,#fff);
    --c-solar:#ffbf2e; --c-wind:#38c6b4; --c-batt:#a68bff; --c-gas:#ff8a55; --c-dsr:#ff6fa8; --c-cold:#6fb0ff; --c-storm:#a48cff;
    --ok:#52b886; --warn:#e2a840; --alarm:#f0675a;
    --ok-bg:#1d3a2c; --warn-bg:#3d3017; --alarm-bg:#47201c; --scrim:rgba(4,8,9,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#100e1d; --panel:#18152b; --sunk:#201c38; --ink:#e8e6f5; --muted:#9a95b8; --rule:#322b55;
  --hv:#d281b6; --mv:#5db3d6; --accent:color-mix(in srgb,var(--wu-navy) 30%,#fff); --on-accent:#120f22; --pulse:#0c1416;
    --brand:color-mix(in srgb,var(--wu-navy) 80%,#000); --brand-2:var(--wu-navy); --brand-line:color-mix(in srgb,var(--wu-navy) 70%,#fff);
    --c-solar:#ffbf2e; --c-wind:#38c6b4; --c-batt:#a68bff; --c-gas:#ff8a55; --c-dsr:#ff6fa8; --c-cold:#6fb0ff; --c-storm:#a48cff;
  --ok:#52b886; --warn:#e2a840; --alarm:#f0675a;
  --ok-bg:#1d3a2c; --warn-bg:#3d3017; --alarm-bg:#47201c; --scrim:rgba(4,8,9,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* Header: company band */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--brand-ink);border-bottom:3px solid var(--zap)}
.bar-in{max-width:1280px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{flex:none;width:46px;height:46px;display:block}
.logo svg{width:100%;height:100%;display:block}
.co{margin:0;font:700 12px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--zap)}
.brand h1{margin:1px 0 0;font:700 24px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--brand-ink)}
#scnLabel{margin:3px 0 0;font-size:13px;color:var(--brand-muted)}
.clock{display:flex;flex-direction:column;line-height:1.1}
.clock b{font:600 28px var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--zap)}
.clock span{font-size:12px;color:var(--brand-muted)}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.btn{border:1px solid var(--rule);background:var(--sunk);padding:7px 14px;border-radius:4px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.big{padding:12px 22px;font-size:16px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.lock-note{margin:8px 0 0;font-size:13px;font-weight:600;color:var(--warn);text-align:right}
.bar .btn,.dock .btn{background:var(--brand-2);border-color:var(--brand-line);color:var(--brand-ink)}
.bar .btn:hover,.dock .btn:hover{border-color:var(--brand-muted)}
.bar .btn.primary,.dock .btn.primary{background:var(--zap);border-color:var(--zap);color:var(--zap-ink)}
.seg{display:inline-flex;border:1px solid var(--brand-line);border-radius:4px;overflow:hidden}
.seg button{border:0;background:var(--brand-2);color:var(--brand-ink);padding:7px 11px;cursor:pointer;font:600 13px var(--f-mono)}
.seg button+button{border-left:1px solid var(--brand-line)}
.seg button[aria-pressed="true"]{background:var(--zap);color:var(--zap-ink)}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer}
.bar .chk{color:var(--brand-muted)}
.bar :focus-visible{outline-color:var(--zap)}
.kpis{display:flex;gap:20px;margin-left:auto}
.kpi{display:flex;flex-direction:column;line-height:1.15}
.kpi .k{font:600 11px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--brand-muted)}
.kpi .v{font:600 17px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--brand-ink)}
.kpi .v.bad{color:var(--alarm-on-brand)}
.kpi .s{font:500 12px var(--f-body);color:var(--brand-muted)}
.kpi-firm{padding:3px 10px;border-left:4px solid var(--ok-on-brand);background:var(--brand-2);border-radius:3px}
.kpi-firm.warn{border-left-color:var(--zap);background:var(--warn-bg)}
.kpi-firm.bad{border-left-color:var(--alarm);background:var(--alarm-bg)}
.kpi-firm.warn .k,.kpi-firm.bad .k{color:var(--muted)}
.kpi-firm.warn .v{color:var(--ink)}.kpi-firm.warn .s{color:var(--warn)}
.kpi-firm.bad .s,.kpi-firm.bad .v{color:var(--alarm)}

.banner{color:var(--ink);max-width:1280px;margin:0 auto 10px;margin-left:max(16px,env(safe-area-inset-left,0px));margin-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:5px;border:1px solid var(--rule);background:var(--sunk)}
@media (min-width:1312px){.banner{margin-left:auto;margin-right:auto}}
.banner.alarm{background:var(--alarm-bg);border-color:var(--alarm)}
.banner.warn{background:var(--warn-bg);border-color:var(--warn)}
.banner .msg{flex:1 1 320px;min-width:0}
.banner .msg b{font-family:var(--f-mono);margin-right:6px}
.banner .g{display:block;font-weight:600;margin-top:2px}

/* Desk */
.desk{max-width:1280px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);grid-template-areas:"mimic sec" "ahead log" "flex flex"}
.p-mimic{grid-area:mimic}.p-sec{grid-area:sec}.p-ahead{grid-area:ahead}.p-log{grid-area:log}.p-flex{grid-area:flex}
@media (max-width:920px){.desk{grid-template-columns:minmax(0,1fr);grid-template-areas:"mimic" "sec" "ahead" "flex" "log"}.kpis{margin-left:0}}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:14px 16px;min-width:0}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;margin-bottom:8px}
.ph h2{margin:0;font:700 15px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--ink);display:flex;align-items:center;gap:9px}
.ph h2::before{content:"";width:10px;height:10px;border-radius:2px;background:var(--pc,var(--accent));transform:rotate(45deg)}
.p-mimic{--pc:var(--mv)}.p-sec{--pc:var(--c-gas)}.p-ahead{--pc:var(--c-wind)}.p-log{--pc:var(--c-batt)}.p-flex{--pc:var(--c-solar)}
.c-id{display:flex;gap:10px;align-items:center;min-width:0}
.ico{flex:none;width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--tc);background:var(--sunk);background:color-mix(in srgb,var(--tc) 15%,transparent)}
.ico svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.asym .sym{fill:var(--sc)}.asym .sym-o{stroke:var(--sc)}.asym .sym-l{stroke:var(--sc)}.asym text{fill:var(--sc)}
.sheet-brand{display:flex;gap:12px;align-items:center;background:var(--brand);color:var(--brand-ink);margin:-24px calc(-1 * clamp(16px,4vw,32px)) 20px;padding:16px clamp(16px,4vw,32px);border-radius:7px 7px 0 0;border-bottom:3px solid var(--zap)}
.sheet-brand .tag{margin:2px 0 0;color:var(--brand-muted);font-size:13.5px}
.scn{border-top:4px solid var(--sc)!important}
.scn .f{color:var(--sc)!important}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:16px;height:0;border-top:2.5px solid;vertical-align:middle;margin-right:5px}
.legend i.box{height:10px;border:0;width:12px}
.scroll{overflow-x:auto}
svg{display:block}
.mimic-svg,.chart-svg{width:100%;height:auto}

/* SVG mimic */
svg text{font-family:var(--f-body);fill:var(--ink)}
.t-bus{font:600 13px var(--f-display);letter-spacing:.1em;fill:var(--muted)}
.bus{stroke-width:7;stroke-linecap:round}
.hv{stroke:var(--hv)}.mv{stroke:var(--mv)}
.cond{stroke-width:3.5}
.flow{stroke:var(--pulse);stroke-width:2.6;stroke-dasharray:2 14;stroke-linecap:round;fill:none;animation:flowF 1.2s linear infinite}
.flow.rev{animation-name:flowR}
.flow.idle{display:none}
@keyframes flowF{to{stroke-dashoffset:-16}}
@keyframes flowR{to{stroke-dashoffset:16}}
.brk{fill:var(--ink);stroke:var(--ink);stroke-width:1.5}
.cct.out .brk{fill:var(--panel)}
.cct.out .cond,.cct.out .wdg{stroke-dasharray:5 5;opacity:.45}
.wdg{fill:var(--panel);stroke-width:3}
.cct[data-lvl="warn"] .wdg{fill:var(--warn-bg)}
.cct[data-lvl="alarm"] .wdg{fill:var(--alarm-bg)}
.tx-name{font:700 18px var(--f-display);letter-spacing:.03em}
.tx-sub{font:500 11px var(--f-body);fill:var(--muted)}
.tx-load{font:600 15px var(--f-mono)}
.cct[data-lvl="warn"] .tx-load{fill:var(--warn)}
.cct[data-lvl="alarm"] .tx-load{fill:var(--alarm)}
.cct.out .tx-load{fill:var(--alarm);font:700 13px var(--f-display);letter-spacing:.08em}
.cct.out.planned .tx-load{fill:var(--muted)}
.tx-flow{font:500 12px var(--f-mono);fill:var(--muted)}
.tbar{fill:var(--sunk);stroke:var(--rule)}
.tfill{fill:var(--ok)}.tfill.warn{fill:var(--warn)}.tfill.alarm{fill:var(--alarm)}
.ttxt{font:500 11px var(--f-mono);fill:var(--muted)}
.bolt{fill:var(--alarm)}
.sym{fill:var(--ink)}
.sym-o{fill:var(--panel);stroke:var(--ink);stroke-width:2}
.sym-l{stroke:var(--ink);stroke-width:2;fill:none}
.a-name{font:600 12px var(--f-display);letter-spacing:.08em;text-transform:uppercase;fill:var(--muted)}
.a-val{font:600 13px var(--f-mono)}
.a-sub{font:500 11px var(--f-mono);fill:var(--warn)}
.blades{transform-box:fill-box;transform-origin:center;animation:spin 3s linear infinite}
.blades.still{animation:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.flow,.blades{animation:none}}

/* Chart */
.band-insec{fill:var(--alarm);opacity:.12}
.band-over{fill:var(--alarm);opacity:.26}
.gl{stroke:var(--rule);stroke-width:1}
.g0{stroke:var(--muted);stroke-width:1}
.capN{stroke:var(--muted);fill:none;stroke-width:1.6}
.capN1{stroke:var(--warn);fill:none;stroke-width:1.8;stroke-dasharray:6 4}
.fc{stroke:var(--ink);fill:none;stroke-width:1.8;stroke-dasharray:3 3}
.hist{stroke:var(--mv);fill:none;stroke-width:2.6;stroke-linejoin:round}
.nowl{stroke:var(--ink);stroke-width:1}
.ax{font:500 10px var(--f-mono);fill:var(--muted)}
.zone{font:600 11px var(--f-display);letter-spacing:.12em;fill:var(--muted)}

/* Security panel */
.sec-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.pill{font:700 13px var(--f-display);letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:3px;border:1px solid}
.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.pill.alarm{background:var(--alarm-bg);color:var(--alarm);border-color:var(--alarm)}
.sec-sub{font-size:13px;color:var(--muted)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin:0 0 12px}
.facts div{min-width:0}
.facts dt{font:600 11px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:0;font:600 15px var(--f-mono);font-variant-numeric:tabular-nums}
.advice{margin:0 0 12px;padding:10px 12px;border-radius:4px;background:var(--sunk);font-weight:500}
.advice.warn{background:var(--warn-bg)}.advice.alarm{background:var(--alarm-bg)}
.ahead-k{font:600 11px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0}
.ahead-t{margin:2px 0 0;font-size:14px}
.outs{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:4px;font-size:13px}
.outs li{color:var(--muted)}
.outs b{color:var(--ink)}

/* Log */
.log{list-style:none;margin:0;padding:0;max-height:300px;overflow-y:auto;display:grid;gap:6px;font-size:13.5px}
.log li{display:grid;grid-template-columns:46px 1fr;gap:8px}
.log time{font:500 12px var(--f-mono);color:var(--muted);padding-top:1px}
.log li.alarm span{color:var(--alarm);font-weight:600}
.log li.ok span{color:var(--ok)}
.log li.warn span{color:var(--warn)}
.empty{color:var(--muted);font-size:13px}

/* Flex register */
.p-flex .intro{margin:0 0 14px;color:var(--muted);font-size:14px;max-width:72ch}
.groups{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
@media (max-width:920px){.groups{grid-template-columns:minmax(0,1fr)}}
.grp h3{margin:0 0 10px;font:700 17px var(--f-display);letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.grp h3 small{font:500 13px var(--f-body);letter-spacing:0;text-transform:none;color:var(--muted)}
.dir-ico{font:600 14px var(--f-mono);width:22px;height:22px;border-radius:3px;display:inline-grid;place-items:center;background:var(--sunk);border:1px solid var(--rule)}
.cards{display:grid;gap:10px}
.card{border:1px solid var(--rule);border-radius:5px;padding:12px;background:var(--panel);display:grid;gap:8px}
.card.armed{border-color:var(--muted)}
.card.active{border-color:var(--accent);background:var(--sunk)}
.card.auto{border-color:var(--warn);background:var(--warn-bg)}
.c-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.c-top h4{margin:0;font:600 16px var(--f-body)}
.c-top .kind{font-size:12.5px;color:var(--muted)}
.c-av{font:600 14px var(--f-mono);text-align:right}
.c-av small{display:block;font:500 11px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.prices{display:flex;flex-wrap:wrap;gap:4px 14px;margin:0;font-size:12.5px;color:var(--muted)}
.prices b{font-family:var(--f-mono);font-weight:600;color:var(--ink)}
.ctrls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.ctrls{grid-template-columns:1fr}}
.ctl{display:grid;gap:4px}
.ctl .lbl{font:600 11px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ctl .lbl em{font-style:normal;text-transform:none;letter-spacing:0;font-family:var(--f-body);font-weight:500}
.stepper{display:flex;align-items:stretch;border:1px solid var(--rule);border-radius:4px;overflow:hidden;background:var(--panel)}
.stepper button{border:0;background:var(--sunk);width:38px;font:600 18px var(--f-mono);cursor:pointer;touch-action:manipulation}
.stepper button:hover{background:var(--rule)}
.stepper output{flex:1;text-align:center;font:600 15px var(--f-mono);padding:7px 0;font-variant-numeric:tabular-nums}
.stepper output small{font-size:11px;color:var(--muted);margin-left:3px}
.state{margin:0;font-size:13px;color:var(--muted)}
.card.auto .state,.card.active .state{color:var(--ink);font-weight:600}
.soc{display:flex;align-items:center;gap:8px;font:500 12px var(--f-mono);color:var(--muted)}
.soc .trk{flex:1;height:6px;background:var(--sunk);border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.soc .trk i{display:block;height:100%;background:var(--mv)}

/* Overlay */
.overlay{position:fixed;inset:0;z-index:20;background:var(--scrim);display:grid;place-items:center;overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--panel);border:1px solid var(--rule);border-radius:8px;max-width:780px;width:100%;padding:24px clamp(16px,4vw,32px)}
.eyebrow{margin:0 0 4px;font:600 12px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sheet h2{margin:0 0 12px;font:700 clamp(26px,5vw,36px)/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
.sheet h3{margin:20px 0 10px;font:600 14px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.rules{margin:0;padding-left:18px;display:grid;gap:6px;max-width:68ch}
.rules li::marker{color:var(--accent)}
.scns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:640px){.scns{grid-template-columns:minmax(0,1fr)}}
.scn{text-align:left;border:1px solid var(--rule);border-radius:6px;background:var(--sunk);padding:12px;cursor:pointer;display:grid;gap:4px;align-content:start}
.scn[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--panel)}
.scn b{font:700 18px var(--f-display);letter-spacing:.03em;text-transform:uppercase}
.scn .d{font-size:12.5px;color:var(--muted)}
.scn .f{font:600 11px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.scn p{margin:2px 0 0;font-size:13.5px}
.go{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-top:20px}
.fine{font-size:12.5px;color:var(--muted);margin:14px 0 0}
.grade{display:flex;align-items:center;gap:16px;margin:4px 0 16px}
.score{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 20px;align-items:center;margin:0 0 14px;padding:14px 16px;border-radius:6px;background:var(--sunk);border:1px solid var(--rule)}
@media (max-width:520px){.score{grid-template-columns:minmax(0,1fr)}}
.score-big small{display:block;font:600 12px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.score-big b{font:700 44px/1.05 var(--f-mono);font-variant-numeric:tabular-nums;color:var(--accent)}
.score .sum td{padding:3px 0;font-size:13.5px;border-bottom:0}
.submit{display:grid;gap:6px;margin:0 0 18px}
.submit label{font:600 12px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sub-row{display:flex;gap:8px;flex-wrap:wrap}
.sub-row input{flex:1 1 180px;min-width:0;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--rule);border-radius:4px;background:var(--panel);color:var(--ink)}
.submit .fine{margin:0}
.submit .fine.ok{color:var(--ok);font-weight:600}.submit .fine.err{color:var(--alarm)}
.board-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.board-tabs button{border:1px solid var(--rule);border-top:4px solid var(--sc);background:var(--sunk);padding:8px 12px;border-radius:4px;font:700 14px var(--f-display);letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
.board-tabs button[aria-pressed="true"]{background:var(--panel);box-shadow:inset 0 0 0 1px var(--accent);border-color:var(--accent);border-top-color:var(--sc)}
.board{overflow-x:auto;min-height:120px}
.board-t{width:100%;border-collapse:collapse;font-size:14px}
.board-t th{text-align:left;font:600 11px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:2px solid var(--rule);white-space:nowrap}
.board-t td{padding:8px;border-bottom:1px solid var(--rule)}
.board-t td:nth-child(1),.board-t td:nth-child(3){font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.board-t td:nth-child(3){font-weight:600}
.board-t tr.top td:first-child{color:var(--c-solar);font-weight:700}
.board-t tr.me td{background:var(--warn-bg);font-weight:600}
.board-t td.nm{max-width:16ch;overflow-wrap:anywhere}
.grade .lt{font:700 64px/1 var(--f-display);width:76px;height:76px;display:grid;place-items:center;border-radius:6px;border:2px solid}
.grade .lt.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-bg)}
.grade .lt.warn{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.grade .lt.alarm{color:var(--alarm);border-color:var(--alarm);background:var(--alarm-bg)}
.sum{width:100%;border-collapse:collapse;font-size:14px}
.sum td{padding:6px 0;border-bottom:1px solid var(--rule)}
.sum td+td{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sum tr.tot td{font-weight:700;border-bottom:0}
.dock,.tabs{display:none}
.a-sub.muted{fill:var(--muted)}
@media (max-width:920px){
  .tabs{display:flex;border:1px solid var(--rule);border-radius:5px;overflow:hidden;margin-bottom:12px}
  .tabs button{flex:1;border:0;background:var(--sunk);padding:10px 8px;font:600 14px var(--f-display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
  .tabs button small{display:block;font:500 12px var(--f-body);letter-spacing:0;text-transform:none;opacity:.8}
  .tabs button+button{border-left:1px solid var(--rule)}
  .tabs button[aria-selected="true"]{background:var(--ink);color:var(--panel)}
  .tabs i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--alarm);margin-left:6px;vertical-align:middle}
  .groups[data-tab="export"] #grpI,.groups[data-tab="import"] #grpE{display:none}
  .grp h3{display:none}
}
@media (max-width:700px), (max-height:500px) and (orientation:landscape){
  body{font-size:14.5px;padding-bottom:calc(66px + env(safe-area-inset-bottom,0px))}
  .bar{position:static}
  .bar-in{gap:10px 14px}
  .clock,#playBtn,.seg,.controls .chk{display:none}
  .brand h1{font-size:21px}
  .logo{width:40px;height:40px}
  .controls{margin-left:auto}
  .kpis{width:100%;margin-left:0;justify-content:space-between;flex-wrap:wrap;gap:10px;border-top:1px solid var(--rule);padding-top:8px}
  .kpi .v{font-size:15px}
  .desk{gap:12px;padding-block:12px 24px}
  .panel{padding:12px}
  .dock{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:8;align-items:center;gap:10px;background:var(--brand);color:var(--brand-ink);border-top:3px solid var(--zap);padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .dock b{font:600 20px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--zap)}
  .dock .pill{margin-right:auto;font-size:12px;padding:3px 8px;white-space:nowrap}
  .dock .btn{padding:9px 14px}
  #dPlay{min-width:86px}
  .banner{position:fixed;z-index:9;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));bottom:calc(64px + env(safe-area-inset-bottom,0px));margin:0;max-height:45vh;overflow-y:auto;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.28)}
  .facts dd{font-size:14px}
  .log{max-height:240px}
  .c-top h4{font-size:15px}
}
/* ---------- v2 additions ---------- */
[hidden]{display:none!important}
.icon-btn{display:inline-grid;place-items:center;width:38px;height:34px;padding:0}
.icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sky{flex:none;width:118px;height:46px;border-radius:6px;overflow:hidden;border:1px solid var(--brand-line)}
.sky svg{width:100%;height:100%;display:block}
.mode-tag{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:3px;background:var(--zap);color:var(--zap-ink);font:700 11px var(--f-display);letter-spacing:.08em;text-transform:uppercase;vertical-align:1px}

/* Mimic heat + emergency */
.cond.h1{stroke:var(--ok)}.cond.h2{stroke:var(--warn)}.cond.h3{stroke:var(--alarm)}
.tx-em{font:700 12px var(--f-display);letter-spacing:.06em;fill:var(--warn)}
.tx-em.alarm{fill:var(--alarm)}
.ic-k{font:600 11px var(--f-display);letter-spacing:.1em;fill:var(--muted)}
.ic-v{font:600 12px var(--f-mono);fill:var(--muted)}
.ic-v.on{fill:var(--c-wind)}
.panel.flashing{animation:pflash .8s ease-out 2}
@keyframes pflash{0%{box-shadow:0 0 0 0 var(--alarm);background:var(--alarm-bg)}100%{box-shadow:0 0 0 16px transparent}}
.cct.tripflash .wdg{animation:wflash .3s steps(2) 5}
@keyframes wflash{50%{fill:var(--alarm)}}
@media (prefers-reduced-motion:reduce){.panel.flashing,.cct.tripflash .wdg{animation:none}}

/* Phone asset chips */
.chips{display:none}
.chip{border:1px solid var(--rule);border-top:3px solid var(--tc);border-radius:6px;padding:6px 8px;display:grid;gap:1px;min-width:0;background:var(--sunk)}
.chip .cn{font:700 11px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--tc)}
.chip .cv{font:600 14px var(--f-mono);font-variant-numeric:tabular-nums}
.chip .cs{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .cs.w{color:var(--warn);font-weight:600}
@media (max-width:420px){.kpis .kpi:nth-child(3){display:none}}
@media (max-width:600px){.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}}

/* Collapsible panels (phones) */
.ph .tog{display:none}
@media (max-width:700px), (max-height:500px) and (orientation:landscape){
  .ph{flex-wrap:nowrap}
  .ph .legend{display:none}
  .ph .tog{display:inline-grid;place-items:center;margin-left:auto;flex:none;border:1px solid var(--rule);background:var(--sunk);border-radius:4px;width:34px;height:30px;cursor:pointer}
  .ph .tog svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
  .panel.collapsed .ph{margin-bottom:0}
  .panel.collapsed > :not(.ph){display:none!important}
  .panel.collapsed .ph .tog svg{transform:rotate(-90deg)}
  .dock b{padding:2px 8px;border-radius:4px;color:#ffffff;text-shadow:0 1px 2px rgba(0,0,0,.55)}
  .sky{display:none}
}

/* Look-ahead extras */
.fcband{fill:var(--ink);opacity:.08}
.riskband{fill:var(--c-storm);opacity:.13}
.risklbl{font:700 10px var(--f-display);letter-spacing:.1em;fill:var(--c-storm)}
.weather{margin:8px 0 0;padding:8px 10px;border-radius:4px;border-left:4px solid var(--c-storm);background:var(--sunk);font-size:13.5px}
.weather b{color:var(--c-storm)}

/* Switching card */
.xfer{margin:0 0 16px;border-left:4px solid var(--c-wind)}
.xfer.on{background:var(--sunk);border-color:var(--c-wind)}
.xbtns{display:flex;flex-wrap:wrap;gap:8px}
.xbtns .btn{flex:1 1 220px;text-align:left;display:grid;gap:2px}
.xbtns .btn small{font-weight:500;font-size:12.5px;color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card.failed{border-color:var(--alarm);background:var(--alarm-bg)}
.card.failed .state{color:var(--alarm);font-weight:600}
.allow{display:flex;align-items:center;gap:8px;font:500 12px var(--f-mono);color:var(--muted)}
.allow .trk{flex:1;height:6px;background:var(--sunk);border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.allow .trk i{display:block;height:100%;background:var(--tc)}
.allow.low{color:var(--warn)}

/* Start sheet extras */
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:520px){.modes{grid-template-columns:minmax(0,1fr)}}
.mode{text-align:left;border:1px solid var(--rule);border-radius:6px;background:var(--sunk);padding:12px;cursor:pointer;display:grid;gap:3px;align-content:start}
.mode[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--panel)}
.mode b{font:700 18px var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.mode span{font-size:13px;color:var(--muted)}
.diff{display:flex;align-items:center;gap:3px;font:600 11px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.diff svg{width:10px;height:14px}
.diff .on{fill:var(--sc)}.diff .off{fill:var(--rule)}
.diff em{font-style:normal;margin-left:4px}
.opts{display:flex;flex-wrap:wrap;gap:6px 18px}

/* Replay */
.replay{margin:0 0 16px}
.replay .rp{width:100%;height:auto;display:block}
.rp-ins{fill:var(--alarm);opacity:.16}
.rp-net{stroke:var(--mv);stroke-width:2;fill:none;stroke-linejoin:round}
.rp-f{fill:var(--alarm)}.rp-flex{fill:var(--c-solar)}.rp-x{fill:var(--c-wind)}.rp-fail{fill:var(--c-gas)}
.rp-lost{stroke:var(--alarm);stroke-width:3;stroke-linecap:round}
.rp-sum{margin:6px 0 0;font-size:13px;color:var(--muted)}

/* Share */
.share-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 16px}
.share-row .fine{margin:0}
.share-txt{width:100%;font:inherit;font-size:13px;padding:8px;border:1px solid var(--rule);border-radius:4px;background:var(--panel);color:var(--ink)}

/* Board modes */
.board-modes{display:inline-flex;border:1px solid var(--rule);border-radius:4px;overflow:hidden;margin:0 0 10px}
.board-modes button{border:0;background:var(--sunk);padding:8px 12px;cursor:pointer;font:600 13px var(--f-body)}
.board-modes button+button{border-left:1px solid var(--rule)}
.board-modes button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}

/* Tips */
.tip{position:fixed;z-index:15;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(430px,calc(100vw - 32px));background:var(--brand);color:var(--brand-ink);border:2px solid var(--zap);border-radius:8px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.35);display:grid;gap:8px}
.tip .tk{font:700 12px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--zap)}
.tip p{margin:0;line-height:1.45}
.tip .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.tip .btn{background:var(--brand-2);border-color:var(--brand-line);color:var(--brand-ink)}
.tip .btn.primary{background:var(--zap);border-color:var(--zap);color:var(--zap-ink)}
@media (max-width:700px), (max-height:500px) and (orientation:landscape){.tip{bottom:calc(74px + env(safe-area-inset-bottom,0px))}}
.hl{outline:3px solid var(--zap)!important;outline-offset:3px;animation:hlp 1.2s ease-in-out infinite}
@keyframes hlp{50%{outline-color:transparent}}
@media (prefers-reduced-motion:reduce){.hl{animation:none}}

/* Cookie banner + footer */
.cookie{position:fixed;z-index:40;left:0;right:0;bottom:0;background:var(--panel);color:var(--ink);border-top:3px solid var(--zap);box-shadow:0 -6px 20px rgba(0,0,0,.2);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 16px}
.cookie p{margin:0;max-width:62ch;font-size:14px}
.cookie .row{display:flex;gap:8px}
.foot{max-width:1280px;margin:0 auto;padding-block:0 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 16px}
.linkish{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer;font:inherit}
a.btn{text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.other-game{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:16px 0 0;padding:12px 14px;border-radius:6px;border:1px dashed var(--accent);background:var(--sunk)}
.other-game p{margin:0;flex:1 1 240px;font-size:14px}
